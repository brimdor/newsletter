<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily AI Newsletter</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; background:#f6f7fb; color:#111; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .item { display:block; width:100%; text-align:left; background:#fff; border:1px solid #dfe3ee; border-radius:12px; padding:14px; margin:12px 0; cursor:pointer; }
    .item h3 { margin:.1rem 0 .5rem; }
    .meta { color:#566; font-size:.9rem; }
    .overlay.hidden { display:none; }
    .overlay { position:fixed; inset:0; z-index:999; }
    .backdrop { position:absolute; inset:0; background:rgba(0,0,0,.45); }
    .panel { position:relative; margin:5vh auto; width:min(860px,92vw); max-height:90vh; overflow:auto; background:#fff; border-radius:12px; padding:18px; }
    .close { float:right; border:1px solid #ccd; background:#fff; border-radius:8px; padding:.25rem .6rem; cursor:pointer; }
    pre { white-space:pre-wrap; line-height:1.45; background:#fafbff; border:1px solid #e7eaf6; border-radius:8px; padding:12px; }
    a { color:#0b57d0; }
  </style>
</head>
<body>
  <main>
    <h1>Daily AI Newsletter</h1>
    <p>Click a story title to open source details in an overlay.</p>
    <section id="items"></section>
  </main>

  <div id="overlay" class="overlay hidden" aria-hidden="true">
    <div id="backdrop" class="backdrop"></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
      <button id="close" class="close" aria-label="Close">✕</button>
      <h2 id="ov-title">Source details</h2>
      <p><strong>Source link:</strong> <a id="ov-link" target="_blank" rel="noopener noreferrer"></a></p>
      <pre id="ov-content">Loading...</pre>
    </section>
  </div>

  <script>
    const items = [{"id": "item-001", "headline": "AI model compression techniques improve edge deployment", "summary": "New quantization workflows reduce inference latency on ARM devices.", "sourceTitle": "Edge AI Compression Report", "sourceUrl": "https://example.org/research/edge-ai-compression-report", "sourceContentStatus": "ready", "content": "# Edge AI Compression Report\n\nResearchers published practical quantization and pruning pipelines for embedded devices.\n\nKey findings:\n- Integer-aware fine tuning can preserve quality while lowering model size.\n- Distillation + quantization offers balanced memory and accuracy gains.\n- Tooling maturity is improving for ARM64 edge deployments."}, {"id": "item-002", "headline": "Open source observability stack adds low-overhead tracing", "summary": "The project shipped tracing controls tuned for constrained workloads.", "sourceTitle": "Project Release Notes", "sourceUrl": "https://news.ycombinator.com/", "sourceContentStatus": "unavailable", "content": ""}, {"id": "item-003", "headline": "Security baseline checklist for small infrastructure teams", "summary": "A practical hardening sequence for SSH, patching, and firewall policy.", "sourceTitle": "Infrastructure Security Checklist", "sourceUrl": "https://owasp.org/www-project-top-ten/", "sourceContentStatus": "ready", "content": "## Security baseline checklist\n\n1. Enforce SSH key authentication and disable password login where possible.\n2. Keep OS and package updates current on a regular cadence.\n3. Apply firewall defaults-deny policy with explicit service allowlist.\n4. Centralize logs and monitor critical auth/system events."}];
    const root = document.getElementById('items');
    const ov = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovLink = document.getElementById('ov-link');
    const ovContent = document.getElementById('ov-content');
    const closeBtn = document.getElementById('close');
    const backdrop = document.getElementById('backdrop');

    function openOverlay(item) {
      ov.classList.remove('hidden');
      ov.setAttribute('aria-hidden','false');
      ovTitle.textContent = item.sourceTitle || item.headline || 'Source details';
      if (item.sourceUrl) {
        ovLink.textContent = item.sourceUrl;
        ovLink.href = item.sourceUrl;
      } else {
        ovLink.textContent = 'Source link unavailable';
        ovLink.removeAttribute('href');
      }
      ovContent.textContent = item.content && item.content.trim() ? item.content : 'Full source content is unavailable.';
    }

    function closeOverlay() {
      ov.classList.add('hidden');
      ov.setAttribute('aria-hidden','true');
    }

    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className='item';
      btn.type='button';
      btn.innerHTML = `<h3>${item.headline}</h3><div class="meta">${item.summary||''}</div>`;
      btn.addEventListener('click', () => openOverlay(item));
      root.appendChild(btn);
    });

    closeBtn.addEventListener('click', closeOverlay);
    backdrop.addEventListener('click', closeOverlay);
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeOverlay(); });
  </script>
</body>
</html>
